[tool.poetry]
name = "codesentry"
version = "0.1.0"
description = "Локальный офлайн ИИ-ассистент для код-ревью и анализа технического долга"
authors = ["CodeSentry Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
requests = "^2.32.0"
gitpython = "^3.1.43"
ruff = "^0.6.9"
bandit = "^1.7.9"
radon = "^6.0.1"
filelock = "^3.16.0"
numpy = "^2.1.0"
python-telegram-bot = "^21.6"
python-dotenv = "^1.0.1"
jinja2 = "^3.1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
mypy = "^1.11.0"
pre-commit = "^3.8.0"
black = "^24.8.0"
httpx = "^0.27.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "apps"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
